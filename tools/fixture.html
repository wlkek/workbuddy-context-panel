<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>上下文面板 · 本地验证</title>
<style>
  :root {
    --bg: #17181c; --bg2: #1d1f24; --line: rgba(255,255,255,.07);
    --tx: #d8dde8; --tx2: #8b93a3; --tx3: #656d7c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--tx);
    font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .frame { flex: 1; min-height: 0; display: flex; flex-direction: column;
           padding-top: 30px; }
  .titlebar { height: 64px; flex: 0 0 auto; display: flex; align-items: center;
              gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .titlebar .dot { width: 18px; height: 18px; border-radius: 5px; background: #2b2f38; }
  .titlebar .nm { font-size: 12.5px; color: var(--tx2); }
  .row { flex: 1; min-height: 0; display: flex; }
  .side { width: 220px; flex: 0 0 auto; border-right: 1px solid var(--line);
          padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .side i { display: block; height: 26px; border-radius: 6px; background: rgba(255,255,255,.04); }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; margin-right: 0; }
  .msgs { flex: 1; overflow: auto; padding: 18px 24px; display: flex;
          flex-direction: column; gap: 14px; }
  .m { max-width: 640px; padding: 10px 13px; border-radius: 10px;
       background: rgba(255,255,255,.04); font-size: 12.5px; color: var(--tx2); }
  .m.me { align-self: flex-end; background: rgba(91,156,248,.14); color: #cfe0ff; }
  .composer { flex: 0 0 auto; padding: 12px 0 18px; display: flex; justify-content: center; }
  .box { width: 836px; max-width: calc(100% - 64px); height: 62px; border-radius: 12px;
         border: 1px solid rgba(255,255,255,.12); background: #1b1d22;
         display: flex; align-items: center; padding: 0 14px; color: var(--tx3); font-size: 12.5px; }
  .winbtns { position: fixed; top: 0; right: 0; height: 30px; width: 138px;
             display: flex; align-items: center; justify-content: space-around; }
  .winbtns span { width: 30px; text-align: center; color: var(--tx3); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div class="winbtns"><span>—</span><span>▢</span><span>✕</span></div>
  <div class="frame">
    <div class="titlebar"><div class="dot"></div><div class="nm">WorkBuddy · 本地验证</div></div>
    <div class="row">
      <aside class="side">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </aside>
      <main data-view-id="main-content">
        <div class="msgs">
          <div class="m me">帮我把这个面板的图表补上</div>
          <div class="m">先确认数据口径：一次请求 = 一条带 usage 的记录；固定开销取首个请求的 inputTokens 减去当时可见内容。</div>
          <div class="m me">趋势图要能看出压缩</div>
          <div class="m">压缩会标在柱子上方，红点。</div>
          <div class="m me">宽度能拖吗</div>
          <div class="m">左边缘可以拖，360 到 680 之间。</div>
        </div>
        <div class="composer"><div class="box">输入消息，Enter 发送…</div></div>
      </main>
    </div>
  </div>
</div>

<script src="./data.js"></script>
<script>
  (function () {
    var data = window.__FIXTURE__;
    window.__WB_CTX_ON_REPLY = null;
    window.__WB_CTX_ON_PROGRESS = null;
    window.__WB_CTX_PUSH = function (msg) {
      var delay = msg.op === 'overview' ? 180 : 260;
      if (msg.op === 'overview' && window.__WB_CTX_ON_PROGRESS) {
        var t = 0;
        var iv = setInterval(function () {
          t += 12;
          if (t > 69) { clearInterval(iv); return; }
          if (window.__WB_CTX_ON_PROGRESS) window.__WB_CTX_ON_PROGRESS(msg.rid, { done: t, total: 69 });
        }, 26);
      }
      setTimeout(function () {
        var payload;
        if (msg.op === 'overview') payload = { ok: true, data: data.overview };
        else if (msg.op === 'session') payload = { ok: true, data: data.session };
        else payload = { ok: false, error: 'unknown op' };
        if (window.__WB_CTX_ON_REPLY) window.__WB_CTX_ON_REPLY(msg.rid, payload);
      }, delay);
    };
  })();
</script>
<script src="../mods/context-panel/ui.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var host = document.querySelector('[data-wb-ctx]');
    var fab = host && host.shadowRoot && host.shadowRoot.querySelector('.fab');
    if (!fab) return;
    if (q.get('only') === '1') document.getElementById('app').style.visibility = 'hidden';
    if (q.get('open') === '1') setTimeout(function () { fab.click(); }, 60);
    if (q.get('scroll')) {
      setTimeout(function () {
        var b = host.shadowRoot.querySelector('.js-body');
        if (b) b.scrollTop = Number(q.get('scroll'));
      }, 900);
    }
    if (q.get('view') === 'session') {
      setTimeout(function () {
        var sr = host.shadowRoot;
        var rows = sr.querySelectorAll('.row');
        if (rows.length) rows[0].click();
      }, 420);
    }
  })();
</script>
</body>
</html>
